name: intent-production

# Separate from compose.yaml: approved PostgreSQL, images, credentials and TLS ingress
# are provided by the target environment. No development service or fixture is inherited.
x-runtime-environment: &runtime-environment
  INTENT_ENV: production
  INTENT_ALLOW_DEV_AUTH: "false"
  INTENT_IDENTITY_MODE: local
  INTENT_MODEL_SECRET_KEY: ${INTENT_MODEL_SECRET_KEY:?Set the server-side encryption key}
  INTENT_MODEL_MODE: openai
  INTENT_DATABASE_URL: ${INTENT_DATABASE_URL:?Set the restricted app database URL}
  INTENT_MIGRATION_DATABASE_URL: ${INTENT_MIGRATION_DATABASE_URL:?Set the separate owner database URL}
  INTENT_MODEL_URL: ${INTENT_MODEL_URL:?Set the approved internal model endpoint}
  INTENT_MODEL_NAME: ${INTENT_MODEL_NAME:?Set the approved model name}
  INTENT_MODEL_VERSION: ${INTENT_MODEL_VERSION:?Set the immutable model version}
  INTENT_MODEL_API_KEY: ${INTENT_MODEL_API_KEY:?Supply the model service key from the approved secret channel}
  INTENT_OBJECT_AUTHORIZATION_URL: ${INTENT_OBJECT_AUTHORIZATION_URL:?Set the object authorization endpoint}
  INTENT_OBJECT_AUTHORIZATION_KEY: ${INTENT_OBJECT_AUTHORIZATION_KEY:?Supply the object authorization key from the approved secret channel}
  # These are outbound target hosts. The TLS ingress must separately restrict inbound Host.
  INTENT_ALLOWED_HOSTS: ${INTENT_ALLOWED_HOSTS:?Set exact outbound target hosts}
  INTENT_CORS_ORIGINS: ${INTENT_CORS_ORIGINS:?Set exact HTTPS browser origins}
  INTENT_IDENTITY_DIRECTORY_JSON: ${INTENT_IDENTITY_DIRECTORY_JSON:-}
  INTENT_PLATFORM_ADMINS_JSON: ${INTENT_PLATFORM_ADMINS_JSON:?Set controlled platform administrator account IDs}
  INTENT_CONNECTOR_TARGETS_JSON: ${INTENT_CONNECTOR_TARGETS_JSON:?Set approved connector targets or an explicit empty object}
  INTENT_CREDENTIALS_JSON: ${INTENT_CREDENTIALS_JSON:?Set approved credential references or an explicit empty object}
  INTENT_RESOLVERS_JSON: ${INTENT_RESOLVERS_JSON:?Set approved resolvers or an explicit empty object}
  INTENT_WORKSPACE_TIMEZONES_JSON: ${INTENT_WORKSPACE_TIMEZONES_JSON:?Set workspace time zones or an explicit empty object}
  INTENT_WORKSPACE_LIMITS_JSON: ${INTENT_WORKSPACE_LIMITS_JSON:?Set workspace limits or an explicit empty object}
  INTENT_ALLOW_SHADOW_EVALUATION: "false"

services:
  preflight:
    image: ${INTENT_BACKEND_IMAGE:?Set the reviewed backend image tag}
    pull_policy: never
    environment: *runtime-environment
    command: [python, -m, intent_platform.production_preflight]
    restart: "no"
  migrate:
    image: ${INTENT_BACKEND_IMAGE:?Set the reviewed backend image tag}
    pull_policy: never
    environment: *runtime-environment
    command: [python, -m, intent_platform.migrate]
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: "no"
  api:
    image: ${INTENT_BACKEND_IMAGE:?Set the reviewed backend image tag}
    pull_policy: never
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped
  worker:
    image: ${INTENT_BACKEND_IMAGE:?Set the reviewed backend image tag}
    pull_policy: never
    environment: *runtime-environment
    command: [python, -m, intent_platform.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  ingest-worker:
    image: ${INTENT_BACKEND_IMAGE:?Set the reviewed backend image tag}
    pull_policy: never
    environment: *runtime-environment
    command: [python, -m, intent_platform.ingest_worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    image: ${INTENT_WEB_IMAGE:?Set the reviewed production web image tag}
    pull_policy: never
    ports:
      - "${INTENT_WEB_BIND:?Set the approved ingress bind address}:${INTENT_WEB_PORT:?Set the approved ingress port}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
