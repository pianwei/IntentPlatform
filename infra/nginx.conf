# One public web entry; management and runtime remain separate applications/scopes.
resolver 127.0.0.11 valid=5s ipv6=off;
map $intent_embed_csp $intent_effective_embed_csp {
    default $intent_embed_csp;
    "" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'";
}
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    set $intent_api api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    location = / { return 302 /console/; }
    location = /console { return 308 /console/; }
    location /console/assets/ { try_files $uri =404; }
    # This file is emitted only by the explicit development build.
    location = /console/dev-host.html {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' http://localhost:5173 http://127.0.0.1:5173; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }
    location /console/ { try_files $uri $uri/ /console/index.html; }
    location /runtime/assets/ { try_files $uri =404; }
    location = /runtime/index.html { return 404; }

    location ~ ^/chat/(?<intent_chat_id>[A-Za-z0-9_-]+)/?$ {
        auth_request /_chat_policy;
        try_files /runtime/index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    }
    location ~ ^/embed/(?<intent_public_id>[A-Za-z0-9_-]+)/?$ {
        auth_request /_embedding_policy;
        auth_request_set $intent_embed_csp $upstream_http_content_security_policy;
        try_files /runtime/index.html =404;
        add_header Content-Security-Policy $intent_effective_embed_csp always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /_embedding_policy {
        internal;
        proxy_pass http://$intent_api/api/v2/runtime/apps/$intent_public_id/embedding-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
    location = /_chat_policy {
        internal;
        proxy_pass http://$intent_api/api/v2/runtime/apps/$intent_chat_id/chat-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }
    location /api/ {
        proxy_pass http://$intent_api;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /docs { proxy_pass http://$intent_api; }
    location = /docs/app.js { proxy_pass http://$intent_api; }
    location = /openapi.json { proxy_pass http://$intent_api; }
    location /health { proxy_pass http://$intent_api; }
    location / { return 404; }
}
